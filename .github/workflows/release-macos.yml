name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v2.1.6

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.kind }} ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [client, server]
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VERSION: "2.1.6"
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked package manager
        run: npm install --global pnpm@11.9.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare verified Cloudflare Tunnel binaries
        if: matrix.kind == 'server'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor
          gh release download "${{ inputs.tag }}" --pattern 'cloudflared-macos-*' --dir vendor
          mv vendor/cloudflared-macos-x64 vendor/cloudflared-darwin-x64
          mv vendor/cloudflared-macos-arm64 vendor/cloudflared-darwin-arm64
          chmod 755 vendor/cloudflared-darwin-x64 vendor/cloudflared-darwin-arm64
          test "$(stat -f %z vendor/cloudflared-darwin-x64)" -gt 1000000
          test "$(stat -f %z vendor/cloudflared-darwin-arm64)" -gt 1000000

      - name: Build DMG and ZIP
        run: |
          npx electron-builder \
            --config electron-builder-mac-${{ matrix.kind }}.json \
            --mac \
            --${{ matrix.arch }}

      - name: Verify package names, size and privacy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == "client" ]]; then
            label="客户端"
            folder="dist-mac-client"
          else
            label="服务器"
            folder="dist-mac-server"
          fi
          dmg="$folder/SyncWatch同步观影-${label}-v${VERSION}-${{ matrix.arch }}.dmg"
          zip="$folder/SyncWatch同步观影-${label}-v${VERSION}-${{ matrix.arch }}.zip"
          test -s "$dmg"
          test -s "$zip"
          old_ascii="tang""jingxuan"
          old_name="唐""靖轩"
          ! grep -aEqi "${old_ascii}|${old_name}" "$dmg"
          ! grep -aEqi "${old_ascii}|${old_name}" "$zip"
          shasum -a 256 "$dmg" "$zip"

      - name: Upload packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == "client" ]]; then
            label="客户端"
            folder="dist-mac-client"
          else
            label="服务器"
            folder="dist-mac-server"
          fi
          gh release upload "${{ inputs.tag }}" \
            "$folder/SyncWatch同步观影-${label}-v${VERSION}-${{ matrix.arch }}.dmg" \
            "$folder/SyncWatch同步观影-${label}-v${VERSION}-${{ matrix.arch }}.zip" \
            --clobber
